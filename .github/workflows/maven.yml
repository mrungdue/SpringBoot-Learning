# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "mrungdue-patch-1" ]
  pull_request:
    branches: [ "mrungdue-patch-1" ]

jobs:
  pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: run test commands without nondex
        run: mvn -pl 2.x/chapter2-1 test -Dtest=com.didispace.chapter21.Chapter21ApplicationTests#testUserController
  
  flaky:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@master
     - name: Set up JDK 8
       uses: actions/setup-java@v4
       with:
         java-version: '8'
         distribution: 'temurin'
         cache: maven
     - name: run test commands with nondex
       run: mvn -pl 2.x/chapter2-1 edu.illinois:nondex-maven-plugin:2.1.1:nondex -Dtest=com.didispace.chapter21.Chapter21ApplicationTests#testUserController -DnondexRuns=10
       continue-on-error: true
